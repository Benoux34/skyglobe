# Publishes the ships heard on the aisstream.io feed as a file the deployed app
# can read.
#
# aisstream.io only offers a live stream, which a serverless app cannot keep
# open. This job listens to it for a few minutes and attaches what it heard to
# the "data" release of this repository; the app reads it from there
# (SHIPS_SNAPSHOT_URL).
#
# Needs one repository secret: AISSTREAM_API_KEY (free, from aisstream.io).
# Without it the job does nothing.
name: Publish ships

on:
  schedule:
    # The shortest interval GitHub allows; runs are often a few minutes late.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ships
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      RELEASE_TAG: data
      # Two listening windows per run, each followed by a publication.
      LISTEN_SECONDS: 130
    steps:
      - name: Check the aisstream.io key
        id: key
        run: |
          if [[ -z "$AISSTREAM_API_KEY" ]]; then
            echo "::notice::Ships are not published: add the AISSTREAM_API_KEY repository secret."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - name: Install the WebSocket client
        if: steps.key.outputs.present == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/ais" --no-audit --no-fund ws@8
          echo "NODE_PATH=$RUNNER_TEMP/ais/node_modules" >> "$GITHUB_ENV"

      - name: Make sure the data release exists
        if: steps.key.outputs.present == 'true'
        run: |
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --latest=false \
              --title "Live data" \
              --notes "Snapshots of live traffic, replaced every few minutes by the Publish workflows."

      - name: Start from the previous snapshot
        if: steps.key.outputs.present == 'true'
        run: |
          gh release download "$RELEASE_TAG" --pattern ships.json --clobber ||
            echo "No previous snapshot: starting from nothing."

      - name: Publish two snapshots
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          for window in 1 2; do
            node .github/scripts/collect-ships.cjs ships.json
            gh release upload "$RELEASE_TAG" ships.json --clobber
          done
