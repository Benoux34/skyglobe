# One-off check: can a GitHub-hosted runner reach OpenSky at all?
# OpenSky ignores connections from several cloud providers, so this is tested
# before building anything on top of it. Uses no secret and one anonymous credit.
name: OpenSky probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/opensky-probe.yml

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reach the OpenSky API (small area, anonymous)
        id: api
        continue-on-error: true
        run: |
          curl -sS -m 40 -o states.json \
            -w "api: HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" \
            "https://opensky-network.org/api/states/all?lamin=45&lomin=5&lamax=47&lomax=8"
          grep -q '"states"' states.json

      - name: Reach the OpenSky sign-in server
        id: auth
        continue-on-error: true
        run: |
          # No credentials are sent: any HTTP answer, even a refusal, proves the server is reachable.
          curl -sS -m 20 -o /dev/null \
            -w "auth: HTTP %{http_code}, %{time_total}s\n" \
            -X POST -d "grant_type=client_credentials" \
            "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token"

      - name: Verdict
        run: |
          echo "API reachable:     ${{ steps.api.outcome }}"
          echo "Sign-in reachable: ${{ steps.auth.outcome }}"
          test "${{ steps.api.outcome }}" = "success"
